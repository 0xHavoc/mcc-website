<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCC — Monopoli Coders Club</title>

<script>
  try {
    if (localStorage.getItem('mcc-theme') === 'light') {
      document.documentElement.classList.add('light');
    }
  } catch (e) {}
</script>

<style>
  /* ============ THEME VARIABLES ============ */
  :root {
    --bg: #04060b;
    --fg: #ffffff;
    --fg-mid: rgba(255, 255, 255, 0.75);
    --fg-muted: rgba(255, 255, 255, 0.55);
    --fg-faint: rgba(255, 255, 255, 0.35);

    --line: rgba(255, 255, 255, 0.09);

    --card-bg: rgba(8, 10, 18, 0.55);
    --card-border-inner: rgba(255, 255, 255, 0.06);
    --card-highlight-inner: rgba(255, 255, 255, 0.12);
    --card-shadow: 0 40px 120px rgba(0, 0, 0, 0.7);
    --card-glow: rgba(97, 174, 230, 0.22);

    --nav-bg: rgba(255, 255, 255, 0.02);
    --nav-border: rgba(255, 255, 255, 0.08);
    --nav-text: rgba(255, 255, 255, 0.75);
    --nav-hover-text: #0a0c12;

    --grid-color: rgba(255, 255, 255, 0.025);
    --noise-opacity: 0.07;

    --c1: #61aee6;
    --c2: #a78bfa;
    --c3: #ff6b6b;
    --success: #4ade80;

    --boot-bg: #04060b;
    --boot-accent: #7dd3fc;
    --boot-success: #4ade80;

    --cursor-dot-color: #ffffff;
    --cursor-dot-glow: #7dd3fc;
    --cursor-ring-color: rgba(125, 211, 252, 0.55);
    --cursor-ring-hover: rgba(125, 211, 252, 1);
    --cursor-ring-bg: rgba(125, 211, 252, 0.04);

    --theme-btn-bg: rgba(255, 255, 255, 0.05);
    --theme-btn-border: rgba(255, 255, 255, 0.1);
  }

  html.light {
    --bg: #f4f2fa;
    --fg: #0a0c12;
    --fg-mid: rgba(10, 12, 18, 0.72);
    --fg-muted: rgba(10, 12, 18, 0.55);
    --fg-faint: rgba(10, 12, 18, 0.4);

    --line: rgba(10, 12, 18, 0.1);

    --card-bg: rgba(255, 255, 255, 0.6);
    --card-border-inner: rgba(10, 12, 18, 0.05);
    --card-highlight-inner: rgba(255, 255, 255, 0.9);
    --card-shadow: 0 40px 120px rgba(100, 90, 150, 0.18);
    --card-glow: rgba(124, 58, 237, 0.14);

    --nav-bg: rgba(10, 12, 18, 0.03);
    --nav-border: rgba(10, 12, 18, 0.1);
    --nav-text: rgba(10, 12, 18, 0.7);
    --nav-hover-text: #ffffff;

    --grid-color: rgba(10, 12, 18, 0.045);
    --noise-opacity: 0.035;

    --c1: #7c3aed;
    --c2: #a78bfa;
    --c3: #ec4899;
    --success: #059669;

    --boot-bg: #f4f2fa;
    --boot-accent: #7c3aed;
    --boot-success: #059669;

    --cursor-dot-color: #0a0c12;
    --cursor-dot-glow: #7c3aed;
    --cursor-ring-color: rgba(124, 58, 237, 0.55);
    --cursor-ring-hover: rgba(124, 58, 237, 1);
    --cursor-ring-bg: rgba(124, 58, 237, 0.06);

    --theme-btn-bg: rgba(10, 12, 18, 0.05);
    --theme-btn-border: rgba(10, 12, 18, 0.1);
  }

  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }

  /* ============ RESET ============ */
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-feature-settings: 'ss01', 'cv11';
    overflow: hidden;
    transition: background 0.5s ease, color 0.5s ease;
  }

  html, body, a, button, * {
    cursor: none !important;
  }

  /* ============ BOOT — 3 SECONDI ============ */
  .boot {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--boot-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'SF Mono', 'JetBrains Mono', Menlo, Monaco, 'Courier New', monospace;
    font-size: 0.85rem;
    color: var(--boot-accent);
    /* fade out: inizia a 2.6s, dura 0.4s → totale 3.0s */
    animation: bootOut 0.4s 2.6s ease forwards;
    pointer-events: none;
    transition: background 0.5s, color 0.5s;
  }

  @keyframes bootOut {
    to { opacity: 0; visibility: hidden; }
  }

  .boot-inner {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 24px;
    min-width: 260px;
  }

  .boot-line {
    opacity: 0;
    animation: bootLine 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    letter-spacing: 0.02em;
  }
  /* Righe distribuite sui 3s */
  .boot-line:nth-child(1) { animation-delay: 0.30s; }
  .boot-line:nth-child(2) { animation-delay: 1.00s; }
  .boot-line:nth-child(3) { animation-delay: 1.70s; }

  @keyframes bootLine {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .boot-line .p,
  .boot-line .ok {
    color: var(--boot-success);
    margin-right: 6px;
    font-weight: 700;
  }

  .caret {
    display: inline-block;
    width: 0.55em;
    height: 1em;
    background: var(--boot-success);
    vertical-align: text-bottom;
    margin-left: 3px;
    animation: blink 0.7s steps(2) infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  /* Barra di progresso in fondo allo schermo — riempie in 2.6s */
  .boot-progress {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 2px;
    width: 0;
    background: var(--boot-success);
    box-shadow:
      0 0 12px var(--boot-success),
      0 0 4px var(--boot-success);
    animation: bootProgress 2.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  @keyframes bootProgress {
    to { width: 100%; }
  }

  /* ============ LAYERS ============ */
  #shader-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    display: block;
  }

  .grid-overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background-image:
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 20%, transparent 75%);
            mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 20%, transparent 75%);
  }

  .noise {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: var(--noise-opacity);
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    transition: opacity 0.5s;
  }

  /* ============ CURSOR ============ */
  .cursor-dot,
  .cursor-ring {
    position: fixed;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 2147483647;
    border-radius: 50%;
  }

  .cursor-dot {
    width: 10px;
    height: 10px;
    margin: -5px 0 0 -5px;
    background: var(--cursor-dot-color);
    box-shadow:
      0 0 20px var(--cursor-dot-glow),
      0 0 10px var(--cursor-dot-glow),
      0 0 3px var(--cursor-dot-color);
  }

  .cursor-ring {
    width: 40px;
    height: 40px;
    margin: -20px 0 0 -20px;
    border: 2px solid var(--cursor-ring-color);
    background: var(--cursor-ring-bg);
    transition:
      width 0.35s cubic-bezier(0.16, 1, 0.3, 1),
      height 0.35s cubic-bezier(0.16, 1, 0.3, 1),
      margin 0.35s cubic-bezier(0.16, 1, 0.3, 1),
      border-color 0.35s,
      background 0.35s;
  }

  .cursor-ring.hover {
    width: 70px;
    height: 70px;
    margin: -35px 0 0 -35px;
    border-color: var(--cursor-ring-hover);
  }

  .cursor-ring.click {
    width: 22px;
    height: 22px;
    margin: -11px 0 0 -11px;
  }

  /* ============ TOPBAR ============ */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 30;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 22px 30px;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--fg-muted);
    opacity: 0;
    /* inizia a comparire durante il fade-out del boot (2.6-3.0s) */
    animation: fadeIn 0.8s 2.5s ease forwards;
    transition: color 0.5s;
  }

  @keyframes fadeIn { to { opacity: 1; } }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .brand-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
    animation: softPulse 3.2s ease-in-out infinite;
  }

  .brand-name {
    color: var(--fg);
    font-weight: 700;
    letter-spacing: 0.16em;
    transition: color 0.5s;
  }

  .brand-ver {
    color: var(--fg-faint);
    font-size: 0.58rem;
    padding: 2px 7px;
    border: 1px solid var(--line);
    border-radius: 4px;
    letter-spacing: 0.06em;
    font-weight: 500;
  }

  @keyframes softPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.5; transform: scale(0.85); }
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .lang {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .lang button {
    background: none;
    border: none;
    font: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    padding: 4px 2px;
    color: inherit;
    opacity: 0.45;
    transition: opacity 0.3s, color 0.3s;
    pointer-events: auto;
  }

  .lang button.active,
  .lang button:hover {
    opacity: 1;
    color: var(--fg);
  }

  .lang .sep { opacity: 0.25; font-weight: 400; }

  .theme-btn {
    background: var(--theme-btn-bg);
    border: 1px solid var(--theme-btn-border);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    transition: background 0.3s, transform 0.3s, border-color 0.3s;
    color: inherit;
    font-family: inherit;
    pointer-events: auto;
    flex-shrink: 0;
  }

  .theme-btn:hover {
    background: var(--theme-btn-border);
    transform: scale(1.08) rotate(-8deg);
  }

  .theme-btn::after { content: '🌙'; }
  html.light .theme-btn::after { content: '☀️'; }

  /* ============ STAGE ============ */
  .stage {
    position: relative;
    z-index: 3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 120px 24px 100px;
  }

  /* ============ CARD ============ */
  .card-wrap {
    perspective: 1400px;
    opacity: 0;
    transform: translateY(60px) scale(0.94);
    /* entra durante il fade-out del boot */
    animation: cardEnter 1.2s cubic-bezier(0.16, 1, 0.3, 1) 2.3s forwards;
  }

  @keyframes cardEnter {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card {
    position: relative;
    width: min(560px, calc(100vw - 40px));
    padding: 56px 44px 44px;
    border-radius: 30px;
    background: var(--card-bg);
    backdrop-filter: blur(32px) saturate(1.4);
    -webkit-backdrop-filter: blur(32px) saturate(1.4);
    box-shadow:
      var(--card-shadow),
      0 0 0 1px var(--card-border-inner) inset,
      0 1px 0 var(--card-highlight-inner) inset;
    transform-style: preserve-3d;
    transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    isolation: isolate;
    overflow: hidden;
    text-align: center;
    transition: background 0.5s ease, box-shadow 0.5s ease;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.5px;
    background: conic-gradient(
      from var(--angle),
      transparent 0deg,
      rgba(97, 174, 230, 0.9) 30deg,
      rgba(167, 139, 250, 0.9) 70deg,
      rgba(255, 107, 107, 0.9) 110deg,
      transparent 180deg,
      transparent 360deg
    );
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    animation: spin 8s linear infinite;
    pointer-events: none;
    z-index: 3;
  }

  @keyframes spin { to { --angle: 360deg; } }

  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(
      500px circle at var(--mx, 50%) var(--my, 50%),
      var(--card-glow),
      transparent 55%
    );
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
    z-index: 0;
  }

  .card:hover::after { opacity: 1; }

  .card > * { position: relative; z-index: 1; }

  /* ============ LOGO ============ */
  .logo-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    margin: 0 auto 30px;
    opacity: 0;
    animation: logoIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) 2.5s forwards;
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    vertical-align: middle;
  }

  .logo-link:hover { transform: scale(1.04); }

  .logo-img {
    display: block;
    max-width: clamp(180px, 36vw, 260px);
    max-height: 140px;
    width: auto;
    height: auto;
    object-fit: contain;
    transition: filter 0.5s ease;
  }

  .logo-img:not([data-processed]) {
    mix-blend-mode: screen;
    filter: contrast(1.3) brightness(1.05);
  }

  html.light .logo-img[data-processed] {
    filter: invert(1) hue-rotate(180deg);
  }

  html.light .logo-img:not([data-processed]) {
    filter: invert(1) hue-rotate(180deg) contrast(1.1);
    mix-blend-mode: multiply;
  }

  .logo-text {
    display: flex;
    gap: 0.02em;
    font-weight: 900;
    font-size: clamp(4rem, 13vw, 8rem);
    line-height: 0.82;
    letter-spacing: -0.06em;
  }

  .logo-text span {
    display: inline-block;
    background: linear-gradient(135deg, var(--c1) 0%, var(--c2) 50%, var(--c3) 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: gradientShift 9s ease-in-out infinite;
  }

  @keyframes logoIn {
    from {
      opacity: 0;
      transform: translateY(30px) scale(0.9);
      filter: blur(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }
  }

  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* ============ ABOUT ============ */
  .about {
    max-width: 400px;
    margin: 0 auto 30px;
    font-size: 1rem;
    line-height: 1.7;
    color: var(--fg-muted);
    clip-path: inset(0 100% 0 0);
    animation: revealLine 1.2s cubic-bezier(0.16, 1, 0.3, 1) 2.9s forwards;
    transition: color 0.5s;
  }

  @keyframes revealLine {
    to { clip-path: inset(0 0 0 0); }
  }

  /* ============ NAV ============ */
  .nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    padding-top: 26px;
    border-top: 1px solid var(--line);
    transition: border-color 0.5s;
  }

  .nav a {
    position: relative;
    padding: 9px 17px;
    font-size: 0.84rem;
    font-weight: 500;
    color: var(--nav-text);
    text-decoration: none;
    border-radius: 999px;
    border: 1px solid var(--nav-border);
    background: var(--nav-bg);
    overflow: hidden;
    opacity: 0;
    transform: translateY(12px);
    animation: navIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    transition:
      transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
      border-color 0.35s,
      background 0.5s,
      color 0.5s;
  }

  .nav a:nth-child(1) { animation-delay: 3.00s; }
  .nav a:nth-child(2) { animation-delay: 3.10s; }
  .nav a:nth-child(3) { animation-delay: 3.20s; }
  .nav a:nth-child(4) { animation-delay: 3.30s; }

  @keyframes navIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .nav a::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .nav a span {
    position: relative;
    z-index: 1;
    transition: color 0.35s;
  }

  .nav a:hover {
    transform: translateY(-2px);
    border-color: transparent;
  }

  .nav a:hover::before { opacity: 1; }
  .nav a:hover span { color: var(--nav-hover-text); font-weight: 600; }

  /* ============ FIXED FOOTERS ============ */
  .footer {
    position: fixed;
    bottom: 24px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--fg-faint);
    opacity: 0;
    animation: fadeIn 1.2s 3.1s ease forwards;
    transition: color 0.5s;
  }

  .footer-left { left: 30px; }
  .footer-right { right: 30px; }

  .footer .heart { color: var(--c3); }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 720px) {
    .topbar {
      padding: 16px 16px;
      gap: 10px;
      font-size: 0.6rem;
    }
    .brand-ver { display: none; }
    .footer {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      bottom: 16px;
    }
    .footer-left { left: 16px; }
    .footer-right { right: 16px; }
  }

  @media (max-width: 520px) {
    .card { padding: 40px 22px 32px; border-radius: 24px; }
    .nav { flex-direction: column; }
    .nav a { width: 100%; text-align: center; }
    .stage { padding: 110px 16px 90px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

  <!-- BOOT (3s totali) -->
  <div class="boot" aria-hidden="true">
    <div class="boot-inner">
      <div class="boot-line"><span class="p">$</span> init mcc.club</div>
      <div class="boot-line"><span class="p">&gt;</span> mounting shaders</div>
      <div class="boot-line"><span class="ok">✓</span> ready<span class="caret"></span></div>
    </div>
    <div class="boot-progress"></div>
  </div>

  <!-- LAYERS -->
  <canvas id="shader-canvas"></canvas>
  <div class="grid-overlay"></div>
  <div class="noise"></div>

  <!-- CURSOR -->
  <div class="cursor-dot" id="cursor-dot"></div>
  <div class="cursor-ring" id="cursor-ring"></div>

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">MCC</span>
      <span class="brand-ver">v1.0</span>
    </div>

    <div class="actions">
      <div class="lang">
        <button data-lang="it" class="active" type="button">IT</button>
        <span class="sep">/</span>
        <button data-lang="en" type="button">EN</button>
      </div>
      <button id="theme-toggle" class="theme-btn" aria-label="Cambia tema" type="button"></button>
    </div>
  </div>

  <!-- MAIN -->
  <main class="stage">
    <div class="card-wrap">
      <div class="card" id="card">

        <a href="https://matteostifano.github.io/mcc-website/index.html" class="logo-link" aria-label="Monopoli Coders Club">
          <img
            id="logo-img"
            src="https://matteostifano.github.io/mcc-website/mcc_logo_dark.jpg"
            alt="Monopoli Coders Club"
            class="logo-img"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="logo-text" style="display:none" aria-hidden="true">
            <span>M</span><span>C</span><span>C</span>
          </div>
        </a>

        <p class="about" id="about">
          Una community che trasforma idee in esperimenti.<br>
          Codici, Creatività, Connessioni.
        </p>

        <nav class="nav" id="nav">
          <a href="https://matteostifano.github.io/mcc-website/chi-siamo.html"><span>Chi siamo</span></a>
          <a href="https://matteostifano.github.io/mcc-website/workshops.html"><span>Workshops</span></a>
          <a href="https://matteostifano.github.io/mcc-website/progetti.html"><span>Progetti</span></a>
          <a href="https://matteostifano.github.io/mcc-website/contatti.html"><span>Contatti</span></a>
        </nav>
      </div>
    </div>
  </main>

  <!-- FIXED FOOTERS -->
  <div class="footer footer-left">© 2026 Monopoli Coders Club</div>
  <div class="footer footer-right">Made with <span class="heart">♥</span> in Monopoli</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script>

  <script>
    /* ============================================================
       GLOBAL THEME STATE
       ============================================================ */
    window.MCC = window.MCC || {};
    window.MCC.themeTarget = document.documentElement.classList.contains('light') ? 1 : 0;
    window.MCC.themeCurrent = window.MCC.themeTarget;

    /* ============================================================
       THEME TOGGLE
       ============================================================ */
    (function bindThemeToggle() {
      const btn = document.getElementById('theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const isLight = document.documentElement.classList.toggle('light');
        window.MCC.themeTarget = isLight ? 1 : 0;
        try {
          localStorage.setItem('mcc-theme', isLight ? 'light' : 'dark');
        } catch (err) {}
      });
    })();

    /* ============================================================
       LOGO — strip dark background via canvas
       ============================================================ */
    (function stripLogoBackground() {
      const imgEl = document.getElementById('logo-img');
      if (!imgEl) return;

      const src = imgEl.src;
      const loader = new Image();
      loader.crossOrigin = 'anonymous';

      loader.onload = () => {
        try {
          const c = document.createElement('canvas');
          c.width  = loader.naturalWidth;
          c.height = loader.naturalHeight;
          const ctx = c.getContext('2d');
          ctx.drawImage(loader, 0, 0);

          const idata = ctx.getImageData(0, 0, c.width, c.height);
          const d = idata.data;

          for (let i = 0; i < d.length; i += 4) {
            const r = d[i], g = d[i+1], b = d[i+2];
            const max = Math.max(r, g, b);

            if (max < 50) {
              d[i+3] = 0;
            } else if (max < 100) {
              d[i+3] = Math.round(((max - 50) / 50) * 255);
            }
          }

          ctx.putImageData(idata, 0, 0);

          imgEl.src = c.toDataURL('image/png');
          imgEl.dataset.processed = 'true';
        } catch (err) {
          console.warn('[MCC] Logo canvas processing failed:', err);
        }
      };

      loader.onerror = () => {
        console.warn('[MCC] Logo image failed to load');
      };

      loader.src = src;
    })();

    /* ============================================================
       CUSTOM CURSOR
       ============================================================ */
    (function cursor() {
      const dot  = document.getElementById('cursor-dot');
      const ring = document.getElementById('cursor-ring');
      if (!dot || !ring) return;

      let mx = window.innerWidth / 2;
      let my = window.innerHeight / 2;
      let rx = mx, ry = my;

      dot.style.left  = mx + 'px';
      dot.style.top   = my + 'px';
      ring.style.left = rx + 'px';
      ring.style.top  = ry + 'px';

      document.addEventListener('mousemove', (e) => {
        mx = e.clientX;
        my = e.clientY;
      }, { passive: true });

      document.addEventListener('mousedown', () => ring.classList.add('click'));
      document.addEventListener('mouseup',   () => ring.classList.remove('click'));

      function bindHover() {
        document.querySelectorAll('a, button').forEach(el => {
          if (el.dataset.cursorBound) return;
          el.dataset.cursorBound = '1';
          el.addEventListener('mouseenter', () => ring.classList.add('hover'));
          el.addEventListener('mouseleave', () => ring.classList.remove('hover'));
        });
      }
      bindHover();

      function loop() {
        dot.style.left = mx + 'px';
        dot.style.top  = my + 'px';
        rx += (mx - rx) * 0.18;
        ry += (my - ry) * 0.18;
        ring.style.left = rx + 'px';
        ring.style.top  = ry + 'px';
        requestAnimationFrame(loop);
      }
      loop();
    })();

    /* ============================================================
       TRANSLATIONS + LANGUAGE TOGGLE
       ============================================================ */
    const translations = {
      it: {
        about: 'Una community che trasforma idee in esperimenti.<br>Codici, Creatività, Connessioni.',
        nav: ['Chi siamo', 'Workshops', 'Progetti', 'Contatti']
      },
      en: {
        about: 'A community turning ideas into experiments.<br>Code, Creativity, Connections.',
        nav: ['About', 'Workshops', 'Projects', 'Contacts']
      }
    };

    (function bindLanguageToggle() {
      const langButtons = document.querySelectorAll('.lang button');
      langButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const lang = btn.dataset.lang;
          langButtons.forEach(b => b.classList.toggle('active', b === btn));

          const t = translations[lang];
          if (!t) return;

          const about = document.getElementById('about');
          if (about) about.innerHTML = t.about;

          const navSpans = document.querySelectorAll('#nav a span');
          navSpans.forEach((span, i) => {
            if (t.nav[i]) span.textContent = t.nav[i];
          });
        });
      });
    })();

    /* ============================================================
       SHADER
       ============================================================ */
    (function initShader() {
      try {
        if (typeof THREE === 'undefined') {
          console.warn('[MCC] Three.js not loaded — shader disabled');
          return;
        }

        const canvas = document.getElementById('shader-canvas');
        if (!canvas) return;

        const renderer = new THREE.WebGLRenderer({
          canvas,
          antialias: true,
          alpha: false,
          powerPreference: 'high-performance'
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);

        const scene  = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

        const uniforms = {
          u_time:       { value: 0 },
          u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
          u_mouse:      { value: new THREE.Vector2(window.innerWidth * 0.5, window.innerHeight * 0.5) },
          u_light:      { value: window.MCC.themeCurrent }
        };

        const vertexShader = /* glsl */`
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `;

        const fragmentShader = /* glsl */`
          precision highp float;

          uniform float u_time;
          uniform vec2  u_resolution;
          uniform vec2  u_mouse;
          uniform float u_light;
          varying vec2  vUv;

          float hash(vec2 p) {
            p = fract(p * vec2(123.34, 456.21));
            p += dot(p, p + 45.32);
            return fract(p.x * p.y);
          }

          float vnoise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            float a = hash(i + vec2(0.0, 0.0));
            float b = hash(i + vec2(1.0, 0.0));
            float c = hash(i + vec2(0.0, 1.0));
            float d = hash(i + vec2(1.0, 1.0));
            return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
          }

          float fbm(vec2 p) {
            float v = 0.0;
            float a = 0.5;
            mat2 rot = mat2(0.80, 0.60, -0.60, 0.80);
            for (int i = 0; i < 6; i++) {
              v += a * vnoise(p);
              p = rot * p * 2.03 + 11.7;
              a *= 0.5;
            }
            return v;
          }

          vec3 palette(float t) {
            vec3 a = vec3(0.5);
            vec3 b = vec3(0.5);
            vec3 c = vec3(1.0);
            vec3 d = vec3(0.0, 0.33, 0.67);
            return a + b * cos(6.28318 * (c * t + d));
          }

          void main() {
            vec2 uv = vUv;
            vec2 p = uv - 0.5;
            p.x *= u_resolution.x / u_resolution.y;

            float t = u_time * 0.1;

            vec2 m = (u_mouse / u_resolution) - 0.5;
            m.x *= u_resolution.x / u_resolution.y;
            float md = length(p - m);
            vec2 dir = (p - m) / max(md, 0.0001);
            p -= dir * 0.22 * exp(-md * 2.6);

            vec2 q = vec2(
              fbm(p * 1.4 + vec2(0.0, 0.0) + t),
              fbm(p * 1.4 + vec2(5.2, 1.3) - t * 0.7)
            );
            vec2 r = vec2(
              fbm(p * 1.4 + 3.0 * q + vec2(1.7, 9.2) + 0.15 * t),
              fbm(p * 1.4 + 3.0 * q + vec2(8.3, 2.8) - 0.13 * t)
            );
            float f = fbm(p * 1.4 + 3.5 * r);

            float curtain = pow(abs(sin(f * 5.0 + p.x * 3.0 + t * 3.0)), 3.0);
            curtain *= smoothstep(0.20, 0.80, f);

            float hue = f * 1.3 + 0.4 * q.x + 0.2 * t;

            vec3 darkCol = palette(hue);
            float aurora = smoothstep(0.35, 0.85, f) * (0.6 + 0.4 * curtain);
            darkCol *= aurora * 1.85;
            darkCol += vec3(0.40, 0.85, 1.00) * curtain * 0.55;
            darkCol += vec3(0.85, 0.40, 1.00) * pow(1.0 - f, 3.0) * 0.35;
            darkCol += vec3(0.015, 0.02, 0.05);
            darkCol *= 1.0 - smoothstep(0.5, 1.4, length(uv - 0.5) * 1.5) * 0.9;
            darkCol = darkCol / (darkCol + vec3(1.0));
            darkCol = pow(darkCol, vec3(0.85));

            vec3 lightBg    = vec3(0.955, 0.945, 0.985);
            vec3 pastelBlue = vec3(0.75, 0.85, 1.0);
            vec3 pastelPurp = vec3(0.85, 0.78, 1.0);
            vec3 pastelPink = vec3(1.0, 0.82, 0.90);
            vec3 pastelCyan = vec3(0.78, 0.95, 1.0);

            vec3 auroraL = mix(pastelBlue, pastelPurp, hue * 0.6);
            auroraL = mix(auroraL, pastelPink, curtain * 0.6);
            auroraL = mix(auroraL, pastelCyan, f * 0.4);

            float intensity = smoothstep(0.18, 0.88, f);
            vec3 lightCol = mix(lightBg, auroraL, intensity * 0.55);
            lightCol += pastelCyan * curtain * 0.10;
            lightCol += pastelPink * pow(1.0 - f, 3.0) * 0.06;
            lightCol *= 1.0 - smoothstep(0.65, 1.65, length(uv - 0.5) * 1.35) * 0.10;

            vec3 col = mix(darkCol, lightCol, u_light);

            float g = fract(sin(dot(uv * 100.0 + u_time, vec2(12.9898, 78.233))) * 43758.5453);
            col += (g - 0.5) * 0.022 * mix(1.0, 0.45, u_light);

            gl_FragColor = vec4(col, 1.0);
          }
        `;

        const material = new THREE.ShaderMaterial({
          uniforms,
          vertexShader,
          fragmentShader,
          depthWrite: false,
          depthTest: false
        });

        scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

        let tx = window.innerWidth * 0.5;
        let ty = window.innerHeight * 0.5;
        let sx = tx, sy = ty;

        window.addEventListener('mousemove', (e) => {
          tx = e.clientX;
          ty = e.clientY;
        });

        const clock = new THREE.Clock();

        function animate() {
          requestAnimationFrame(animate);
          uniforms.u_time.value = clock.getElapsedTime();

          sx += (tx - sx) * 0.08;
          sy += (ty - sy) * 0.08;
          uniforms.u_mouse.value.set(sx, sy);

          window.MCC.themeCurrent += (window.MCC.themeTarget - window.MCC.themeCurrent) * 0.06;
          uniforms.u_light.value = window.MCC.themeCurrent;

          renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          renderer.setSize(window.innerWidth, window.innerHeight);
          uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
        });

      } catch (err) {
        console.warn('[MCC] Shader init failed:', err);
      }
    })();

    /* ============================================================
       CARD 3D TILT + GLOW
       ============================================================ */
    (function cardTilt() {
      const card = document.getElementById('card');
      if (!card) return;

      let targetRx = 0, targetRy = 0;
      let curRx = 0, curRy = 0;

      document.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const cx = rect.left + rect.width  / 2;
        const cy = rect.top  + rect.height / 2;

        targetRy =  ((e.clientX - cx) / rect.width)  * 7;
        targetRx = -((e.clientY - cy) / rect.height) * 7;

        card.style.setProperty('--mx', `${e.clientX - rect.left}px`);
        card.style.setProperty('--my', `${e.clientY - rect.top}px`);
      });

      document.addEventListener('mouseleave', () => {
        targetRx = 0;
        targetRy = 0;
      });

      function loop() {
        curRx += (targetRx - curRx) * 0.1;
        curRy += (targetRy - curRy) * 0.1;
        card.style.setProperty('--rx', `${curRx}deg`);
        card.style.setProperty('--ry', `${curRy}deg`);
        requestAnimationFrame(loop);
      }
      loop();
    })();
  </script>
